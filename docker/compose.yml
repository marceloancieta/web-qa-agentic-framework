# Local applications under test. Every image is pinned by digest, so a run today and a run next
# month test the same build; the tag beside the digest says which release it is.
name: web-qa-agentic-framework

services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0@sha256:cea5a4af4aacee498c491491af0408934ec81d004035c0a02ef3e54395e3bf27
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3000/rest/admin/application-version').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 4s
      retries: 40
      start_period: 15s

  # The image of the container lanes (ADR 0009): the Playwright release of package.json, pinned by
  # digest. `npm run lanes:visual` runs the visual lane in it; the repository is mounted as is.
  playwright:
    profiles: ['lanes']
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    working_dir: /work
    volumes:
      - ..:/work
    environment:
      QA_IN_PLAYWRIGHT_IMAGE: '1'
      QA_ENV: ${QA_ENV:-}
      # The run the lane belongs to, so its report and results carry the id of the whole CI run.
      QA_RUN_ID: ${QA_RUN_ID:-}
      CI: ${CI:-}
      # The JUnit file a CI step asks for, relative to the repository, which is mounted at /work.
      QA_JUNIT_REPORT: ${QA_JUNIT_REPORT:-}
      # Juice Shop on the compose network (http://juice-shop:3000), for a host whose published
      # port a container cannot reach: Linux publishes it on 127.0.0.1 only. Empty: qa-config's URL.
      QA_JUICE_SHOP_BASE_URL: ${QA_JUICE_SHOP_BASE_URL:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ipc: host
