# Local applications under test. Every image is pinned by digest, so a run today and a run next
# month test the same build; the tag beside the digest says which release it is.
name: web-qa-agentic-framework

services:
  juice-shop:
    image: &juice-shop-image bkimminich/juice-shop:v20.3.0@sha256:cea5a4af4aacee498c491491af0408934ec81d004035c0a02ef3e54395e3bf27
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck: &juice-shop-health
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3000/rest/admin/application-version').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 4s
      retries: 40
      start_period: 15s

  # Spree Commerce (FUT-01): its API and admin dashboard in one image, on a database of its own.
  # `npm run spree:up` starts both, signs the admin of SPREE_ADMIN_EMAIL in and loads the sample
  # data once (scripts/spree-up.mjs); it also gives SPREE_SECRET_KEY_BASE a new value for the
  # start, so no key is kept in the repository.
  spree:
    image: ghcr.io/spree/spree:6.0.3@sha256:1c20d3b14c7a36ac54666054a3ddd67a4e4941a0ea0a5b9fe2a8d84fe51433de
    depends_on:
      spree-db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3100:3000'
    environment:
      DATABASE_URL: postgres://postgres@spree-db:5432/spree_production
      SECRET_KEY_BASE: ${SPREE_SECRET_KEY_BASE:-}
      SPREE_HOST: localhost:3100
      RAILS_FORCE_SSL: 'false'
      RAILS_ASSUME_SSL: 'false'
      # Spree limits sign-ins, token refreshes and API calls per client IP; every worker of a run
      # shares one IP, so the limits a public store needs would fail a parallel run.
      SPREE_RATE_LIMIT_LOGIN: '1000'
      SPREE_RATE_LIMIT_REFRESH: '1000'
      SPREE_RATE_LIMIT_PER_KEY: '100000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:3000/up']
      interval: 3s
      timeout: 4s
      retries: 60
      start_period: 20s

  # Spree's database, reachable on the compose network only. The local trust login needs no
  # password; nothing outside the network can connect.
  spree-db:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/18/docker
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres']
      interval: 3s
      timeout: 4s
      retries: 20

  # The image of the container lanes (ADR 0009): the Playwright release of package.json, pinned by
  # digest. `npm run lanes:visual` runs the visual lane in it; the repository is mounted as is.
  playwright:
    profiles: ['lanes']
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    working_dir: /work
    volumes:
      - ..:/work
    environment:
      QA_IN_PLAYWRIGHT_IMAGE: '1'
      QA_ENV: ${QA_ENV:-}
      # The run the lane belongs to, so its report and results carry the id of the whole CI run.
      QA_RUN_ID: ${QA_RUN_ID:-}
      CI: ${CI:-}
      # The JUnit file a CI step asks for, relative to the repository, which is mounted at /work.
      QA_JUNIT_REPORT: ${QA_JUNIT_REPORT:-}
      # Juice Shop on the compose network (http://juice-shop:3000), for a host whose published
      # port a container cannot reach: Linux publishes it on 127.0.0.1 only. Empty: qa-config's URL.
      QA_JUICE_SHOP_BASE_URL: ${QA_JUICE_SHOP_BASE_URL:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ipc: host

  # The ZAP baseline lane (ADR 0011): ZAP 2.17.0, the build of 2026-08-07, pinned by digest.
  # `npm run lanes:zap` starts it and the disposable copy below in a compose project of their own
  # (web-qa-zap-<pack>), runs the plan it writes to reports/zap/, and removes both afterwards.
  zap:
    profiles: ['zap']
    image: zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    volumes:
      - ../reports/zap:/zap/wrk:rw

  # The ZAP lane's target: a disposable Juice Shop, the image of the service above, reachable on its
  # project's network only. The spider changes Juice Shop's state (it solves challenges), so it never
  # scans the one other work uses.
  juice-shop-scan:
    profiles: ['zap']
    image: *juice-shop-image
    expose:
      - '3000'
    healthcheck: *juice-shop-health
