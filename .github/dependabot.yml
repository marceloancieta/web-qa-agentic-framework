# Dependency updates (CI-03). A version is proposed only after a cooldown of 14 days, so a release
# that is pulled or compromised soon after publishing never reaches a pull request. Minor and patch
# updates come grouped, one pull request per ecosystem; a major update comes alone. The commit
# titles `build(deps)`, `build(deps-dev)` and `ci(deps)` are the dependency-update exception of
# ADR 0006 (`DEPENDENCY_UPDATES` in scripts/changelog.mjs).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Node's typings follow the lowest Node the project supports (`.nvmrc`, `engines`): typings of a
    # later major accept APIs that fail at run time on that Node. They move with `.nvmrc`, by hand.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Playwright 1.65 ships Firefox 159 (build 1572), whose page crashes while axe reads
      # `aria-labelledby` (microsoft/playwright#43967): the a11y lane and TC-SEARCH-20 fail on
      # desktop Firefox. The 1.65 releases are skipped until one carries a Firefox with the fix.
      - dependency-name: '@playwright/test'
        versions: ['1.65.x']
      # typescript-eslint 8.74.0 accepts `typescript >=4.8.4 <6.1.0`, so `npm ci` refuses TypeScript
      # 7 (ERESOLVE). TypeScript 7 is skipped until a typescript-eslint release accepts it; then
      # `scripts/lib/corpus.mjs`, which reads specs with the compiler API, is checked with it too.
      - dependency-name: 'typescript'
        versions: ['7.x']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
