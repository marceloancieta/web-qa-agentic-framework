# CodeQL code scanning of the JavaScript and TypeScript sources (CI-03). It runs no npm script: the
# analysis is GitHub's own and needs no build (`build-mode: none`).
#
# Code scanning needs a public repository, or GitHub Code Security on a private one. While the
# repository is private the workflow runs on demand only; when it becomes public (DOC-05), add
# `push: branches: [main]`, `pull_request:` and a weekly `schedule:` to `on:`.
name: codeql

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
