# CodeQL code scanning of the JavaScript and TypeScript sources (CI-03). It runs no npm script: the
# analysis is GitHub's own and needs no build (`build-mode: none`).
#
# Code scanning needs a public repository, or GitHub Code Security on a private one. The job runs
# only when the event says the repository is public; while it is private every trigger skips it, so
# making the repository public (DOC-05) starts the scans without a change here. An event that does
# not carry the repository's visibility skips it too, rather than fail.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
