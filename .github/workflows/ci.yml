# The CI pipeline (CI-01, CI-02). Every step calls an npm script of package.json; the only other
# commands install the toolchain (gitleaks for the secret scan). scripts/__tests__/ci-files.test.mjs
# checks both. One QA_RUN_ID covers the shards, the lanes, the quality gate and the report.
#
#   gates → suite (sharded) ┐
#         → a11y lane       ├→ report: ci:merge → quality:gate over every report → tm:report
#         → visual lane     │
#         → destructive lane┘
#         → zap lane: a ZAP baseline scan of a disposable Juice Shop the lane starts, judged by itself
#   required: one verdict over all of the above, the check branch protection requires
#   flake lane: weekly and on demand only
#   performance: the web vitals and Lighthouse lanes, weekly and on demand only
#
# Under act, which sets ACT (docs/guides/running-tests.md), the artifact steps are skipped: its
# artifact server does not speak the protocol of upload-artifact v7, so the reports stay in the job's
# container and the report job has nothing to merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC: the flake and performance lanes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  QA_ENV: ci
  # One id for the whole run, its re-runs included: "Re-run failed jobs" keeps the reports of the
  # jobs that passed, and the quality gate refuses reports of another run (CI-06).
  QA_RUN_ID: gh-${{ github.run_id }}
  GITLEAKS_VERSION: 8.30.1

jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history scans and the closing commits of the backlog read it all
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
      - run: npm ci
      # Outside the gates: it needs the registry, and a new advisory changes its outcome.
      - run: npm run audit:deps
      - run: npm run ci:browsers
      - run: npm run gates

  suite:
    needs: gates
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The number of shards is the length of this list and `total`; change both together.
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci:browsers
      - run: npm run juice-shop:up
      - name: Run shard ${{ matrix.shard }} of ${{ matrix.total }}
        run: npm test -- --project='juice-shop-*' --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          QA_BLOB_REPORT: '1'
      - if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-${{ matrix.shard }}
          path: |
            blob-report/
            allure-results/
          retention-days: 14

  lane:
    needs: gates
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: [a11y, visual, destructive]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci:browsers
      - run: npm run juice-shop:up
      - name: Run the ${{ matrix.lane }} lane
        if: matrix.lane != 'visual'
        run: npm run lanes:${{ matrix.lane }} -- --project='juice-shop-*'
      - name: Run the visual lane
        if: matrix.lane == 'visual'
        run: npm run lanes:visual -- --project='juice-shop-*'
        env:
          # The lane runs in the pinned container, which reaches Juice Shop on the compose network:
          # Linux publishes the port on 127.0.0.1 only, out of a container's reach.
          QA_JUICE_SHOP_BASE_URL: http://juice-shop:3000
      - if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-${{ matrix.lane }}
          path: |
            reports/lanes/
            allure-results/
            test-results/
          retention-days: 14

  # The ZAP baseline lane (ADR 0011): a spider and a passive scan, a few minutes beside the suite's
  # shards. The lane starts its own disposable Juice Shop and removes it. Its verdict is its own exit
  # code against apps/juice-shop/zap-known.json; it writes no Playwright report, so the quality gate
  # does not read it.
  zap:
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the ZAP baseline lane
        run: npm run lanes:zap -- --pack juice-shop
      - if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap
          path: reports/zap/
          retention-days: 14

  report:
    needs: [gates, suite, lane]
    # It also runs when a shard or a lane failed, to report the failures; not when the run was
    # cancelled (a newer push), whose shards left no reports to merge.
    if: ${{ !cancelled() && needs.gates.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ !env.ACT }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{suite,lane}-*'
          merge-multiple: true
      - run: npm run ci:merge
      - name: Quality gate over the suite and the lanes
        run: npm run quality:gate -- --report reports/playwright.json --report reports/lanes/a11y.json --report reports/lanes/visual.json --report reports/lanes/destructive.json
      - if: ${{ !cancelled() }}
        run: npm run tm:report
      - if: ${{ !cancelled() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            playwright-report/
            reports/
          retention-days: 30

  # The one check branch protection requires of this workflow (docs/repository-settings.md): green
  # only when every job of the change succeeded. It runs even when one failed, since a required
  # check that is skipped counts as passed.
  required:
    needs: [gates, suite, lane, zap, report]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm run ci:needs
        env:
          QA_NEEDS: ${{ toJSON(needs) }}

  flake:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci:browsers
      - run: npm run juice-shop:up
      - run: npm run lanes:flake -- --project='juice-shop-*'
      - if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-flake
          path: reports/lanes/
          retention-days: 30

  # The performance lanes (ADR 0012): web vitals against the ci budgets of qa-config, then
  # Lighthouse. Weekly and on demand, outside the required check: timings on a shared runner vary
  # from run to run, and a budget is calibrated on what this job reports before it gates a change.
  performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci:browsers
      - run: npm run juice-shop:up
      - run: npm run lanes:web-vitals -- --project='juice-shop-*'
      - if: ${{ !cancelled() }}
        run: npm run lanes:lighthouse -- --pack juice-shop
      - if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-performance
          path: |
            reports/lanes/
            reports/lighthouse/
          retention-days: 30
